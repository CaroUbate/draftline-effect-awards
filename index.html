<style>
/* Layout: full-bleed color screens; on wide screens the category card sits left and the nomination panel right, stacked on phones. Single brand look (no theme switch). */
:root{
  --yellow:#FFBC00; --orange:#FF8A00;
  --pink:#FF8DB2;   --hotpink:#F54880;
  --red:#FF1E00; --grandred:#E30A17;    --blue:#0414E8; --skyblue:#8A9EFF;
  --ink:#1E1E1E;    --paper:#FFFFFF; --muted:#B9B4AC;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --label:"Bebas Neue","Oswald","Arial Narrow",sans-serif;
  --body:"Sora","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* scheme per screen */
.screen{--logo:var(--paper);--bg:var(--ink);--title:var(--paper);--effect:var(--yellow);--text:var(--paper);--sub:var(--paper);
  background:var(--bg);color:var(--text);min-height:100%;display:flex;flex-direction:column;
  padding-inline:clamp(16px,5vw,72px);padding-block:20px 32px;box-sizing:border-box}
.s-yellow,.s-pink,.s-red{--logo:var(--ink)}
.s-red{--the:var(--paper)}
.s-yellow{--bg:var(--yellow);--title:var(--ink);--effect:var(--orange);--text:var(--ink);--sub:var(--ink)}
.s-pink{--bg:var(--pink);--title:var(--ink);--effect:var(--hotpink);--text:var(--ink);--sub:var(--ink)}
.s-red{--bg:var(--red);--title:var(--paper);--effect:var(--paper);--text:var(--paper);--sub:var(--ink)}
.s-black{--bg:#000000;--title:var(--grandred);--effect:var(--grandred);--text:var(--paper);--sub:var(--paper);--the:var(--paper)}
.s-blue{--the:var(--paper);--bg:var(--blue);--title:var(--paper);--effect:var(--skyblue);--text:var(--paper);--sub:var(--paper)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar{align-items:flex-start}
.toplabel{font-family:var(--label);font-size:18px;letter-spacing:.08em;padding-top:6px}

.progress{padding-top:6px;display:flex;align-items:center;gap:10px;font-family:var(--label);font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ticks{display:flex;gap:3px}
.ticks i{display:block;width:14px;height:5px;background:currentColor;opacity:.22}
.ticks i.on{opacity:1}

.stage{flex:1;display:grid;gap:clamp(24px,4vw,56px);align-items:center;padding-block:clamp(24px,5vh,56px)}
@media (min-width:960px){.stage.split{grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr)}}

.sub{font-family:var(--label);color:var(--sub);font-size:clamp(20px,2.6vw,34px);line-height:1;letter-spacing:.01em;margin:0 0 .25em}
.title{font-family:var(--display);color:var(--title);font-weight:400;text-transform:uppercase;line-height:.9;letter-spacing:-.005em;margin:0;font-size:clamp(54px,9.4vw,148px);text-wrap:balance}
.effect{font-family:var(--display);color:var(--effect);text-transform:uppercase;line-height:.88;margin:.02em 0 0;font-size:clamp(62px,10.5vw,168px)}
.desc{max-width:30ch;margin:16px 0 0;font-size:clamp(17px,1.7vw,22px);font-weight:300;line-height:1.15;padding-bottom:14px;border-bottom:4px solid var(--effect)}
.desc b{font-weight:700}

/* panel */
.panel{background:var(--ink);color:var(--paper);padding:clamp(20px,3vw,32px);display:grid;gap:18px;min-width:0}
.panel h3{margin:0;font-family:var(--label);font-weight:400;font-size:26px;letter-spacing:.04em;line-height:1}
.field{display:grid;gap:8px}
.field label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea{font:inherit;font-size:17px;color:var(--paper);background:transparent;border:0;border-bottom:2px solid #5a5650;padding:8px 0;border-radius:0;width:100%;box-sizing:border-box}
.field textarea{min-height:96px;resize:vertical;border:2px solid #5a5650;padding:10px 12px}
.field input::placeholder,.field textarea::placeholder{color:#8b867f}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--effect)}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:14px;color:var(--effect);margin:0;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;cursor:pointer;padding:14px 22px;background:var(--effect);color:var(--ink);display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px #5a5650}
.btn.link{background:transparent;color:var(--muted);padding:14px 6px;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.edit:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.spacer{flex:1}

/* intro */
.intro .title{font-size:clamp(64px,12vw,190px)}
.intro .effect{color:var(--yellow)}
.intro .lede{max-width:44ch;font-size:clamp(17px,1.6vw,20px);font-weight:300;margin:18px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.chips span{font-family:var(--label);font-size:15px;letter-spacing:.06em;padding:5px 9px;color:var(--ink)}
.deadline{font-family:var(--label);font-size:20px;letter-spacing:.06em;color:var(--yellow)}

/* summary */
.sumlist{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:2px solid #3a3733}
.sumlist li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-bottom:2px solid #3a3733}
.sumlist .n{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.sumlist .cat{font-family:var(--label);font-size:21px;letter-spacing:.03em;line-height:1}
.sumlist .who{font-size:15px;margin-top:4px;overflow-wrap:anywhere}
.sumlist .who.missing{color:var(--yellow);font-weight:600}
.edit{font:inherit;font-size:14px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.note{font-size:14px;color:var(--muted);margin:0}
.preview-flag{font-size:13px;background:#3a3733;color:var(--paper);padding:8px 12px;margin:0}

canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
.theline{display:flex;align-items:center;gap:.25em;font-family:var(--display);color:var(--the,var(--title));font-size:clamp(28px,4vw,60px);line-height:1;margin:.15em 0 .08em}
.theline .bar{flex:1;max-width:9em;height:.82em;background:var(--paper)}
.eyebrow{display:inline-block;font-family:var(--label);font-size:17px;letter-spacing:.08em;padding:5px 10px;background:var(--text);color:var(--bg);margin-bottom:14px}
.ticks i.gap{margin-left:7px}
.specials{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px}
.specials li{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-family:var(--display);text-transform:uppercase;font-size:clamp(30px,4.6vw,60px);line-height:1}
.specials li small{font-family:var(--body);text-transform:none;font-size:15px;font-weight:300;color:var(--muted);max-width:42ch;line-height:1.35}
.sumlist li.sep{display:block;padding:18px 0 6px;border-bottom:0;font-family:var(--label);font-size:16px;letter-spacing:.1em;color:var(--yellow)}
.sumlist .n.sm{font-family:var(--label);font-size:15px;letter-spacing:.06em;color:var(--muted)}
@keyframes enter{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}.btn{transition:none}}
</style>

   1) Pega aquí la URL de tu implementación de Google Apps Script (termina en /exec).
      Si está vacía, la página funciona en modo vista previa y no envía nada. */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2_56ktjh5jLr67NV7AnZSgWngMJL95FefV4ie0FpUzBLWKYbLgThBih54oSo5Xa7_5Q/exec";
/* 2) Cierre: 15 de octubre de 2026, 11:59:59 p.m. hora Colombia */
const DEADLINE = new Date("2026-10-15T23:59:59-05:00");
/* ======================================= */

const CATS = [
  {n:1, s:"yellow", sub:"Soñamos en grande.", t:"The Big Dream", d:"A quien siempre lleva la idea un poco más lejos. El que escucha <b>“imposible” y entiende “todavía no”.</b>"},
  {n:2, s:"pink",   sub:"Nos enfocamos en resultados extraordinarios.", t:"The Make It Happen", d:"A quien convierte ideas, briefs y ambición en cosas que <b>realmente pasan y generan resultados.</b>"},
  {n:3, s:"red",    sub:"Lideramos con el ejemplo y asumimos la responsabilidad.", t:"The Own It", d:"A quien no espera que alguien más resuelva. <b>Se apropia. Responde. Empuja.</b>"},
  {n:4, s:"yellow", sub:"Atraemos y desarrollamos gente excelente.", t:"The Better Together", d:"A quien hace mejor a la gente que tiene alrededor. <b>Comparte, enseña, conecta y hace crecer talento.</b>"},
  {n:5, s:"red",    sub:"Creamos marcas que nuestros consumidores aman.", t:"The Brand Love", d:"A quien entiende las marcas de verdad y encuentra <b>ideas capaces de hacer que la gente también las quiera.</b>"},
  {n:6, s:"pink",   sub:"Crecemos con nuestros clientes y comunidades.", t:"The Grow Together", d:"A quien entiende que crecer solo no es crecer. Hace que partners, clientes, comunidades <b>y equipo avancen juntos.</b>"},
  {n:7, s:"pink",   sub:"Priorizamos soluciones simples y escalables.", t:"The Keep It Simple", d:"A quien tiene el extraño superpoder de quitarle veinte <b>slides a algo y hacerlo mejor.</b>"},
  {n:8, s:"yellow", sub:"Cuidamos nuestros costos rigurosamente.", t:"The More With Less", d:"A quien demuestra que una gran idea no necesita necesariamente un gran presupuesto. <b>Hace rendir cada peso sin bajar la ambición.</b>"},
  {n:9, s:"blue",   sub:"Pensamos a largo plazo.", t:"The Next", d:"A quien no solo está resolviendo el próximo brief. <b>Está pensando qué viene después.</b>"},
  {n:10,s:"yellow", sub:"Nunca tomamos atajos.", t:"The No Shortcuts", d:"A quien hace las cosas bien incluso cuando hacerlas rápido sería <b>mucho más fácil.</b>"},
  {n:11,s:"blue",   special:true, t:"Big Team", name:"The Big Team Effect", effect:true,
   d:"Reconoce al equipo que hizo que el talento colectivo <b>se convirtiera en un gran resultado.</b>",
   q:"¿Qué equipo nominas?", ph:"Nombre del equipo o sus integrantes"},
  {n:12,s:"yellow", special:true, t:"Project", name:"The Project Effect", effect:true,
   d:"Premia el proyecto que dejó una huella especial <b>por su idea, ejecución e impacto.</b>",
   q:"¿Qué proyecto nominas?", ph:"Nombre del proyecto"},
  {n:13,s:"black",  special:true, t:"Grand Prix", name:"The Grand Prix", effect:false, bar:true,
   d:"El máximo reconocimiento individual para la persona que mejor representa <b>el espíritu, el talento y el efecto de draftLine.</b>",
   q:"¿A quién nominas?", ph:"Nombre y apellido"}
];
CATS.forEach(c=>{ if(!c.name) c.name = c.t + " Effect"; });
const PRINCIPLES = CATS.filter(c=>!c.special), SPECIALS = CATS.filter(c=>c.special);
/* Pasos: 0 portada · 1-10 principios · 11 transición · 12-14 especiales · 15 resumen */
const STEPS = [{k:"intro"}, ...PRINCIPLES.map(c=>({k:"cat",c})), {k:"break"}, ...SPECIALS.map(c=>({k:"cat",c})), {k:"summary"}];
const CHIP_BG = {yellow:"var(--yellow)",pink:"var(--pink)",red:"var(--red)",blue:"var(--skyblue)"};
const KEY = "dl-effect-awards-draft";

let state = load() || {name:"", step:0, answers:{}, sent:false};
if (state.v !== 2) {               // borradores y envíos de la versión anterior (10 categorías)
  if (state.sent) { state.sent = false; state.step = 11; state.added = true; }
  if (state.step > 11) state.step = 11;
  state.v = 2;
}
let sending = false, sendError = "";

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
const app = document.getElementById("app");

function topbar(progress, label){
  const ticks = CATS.map((c,i)=>`<i class="${i<progress?"on":""} ${i===10?"gap":""}"></i>`).join("");
  const left = progress!=null
    ? `<div class="progress" aria-label="Categoría ${progress} de ${CATS.length}"><span class="ticks" aria-hidden="true">${ticks}</span>${pad(progress)} / ${CATS.length}</div>`
    : `<div class="toplabel">${label||"Premios draftLine Effect"}</div>`;
  return `<header class="topbar">${left}<span class="logo" role="img" aria-label="draftLine Effect, 10 años"></span></header>`;
}

function render(){
  if (new Date() > DEADLINE && !state.sent) return renderClosed();
  if (state.sent) return renderDone();
  const st = STEPS[state.step] || STEPS[0];
  if (st.k==="intro") return renderIntro();
  if (st.k==="break") return renderBreak();
  if (st.k==="cat") return renderCat(st.c);
  return renderSummary();
}

function renderIntro(){
  app.innerHTML = `<section class="screen intro">
    ${topbar(null)}
    <div class="stage split enter">
      <div>
        <p class="sub" style="color:var(--yellow)">10 años · 10 principios ABI · 10 categorías + 3 especiales</p>
        <h1 class="title">¿Quién hace<br>el</h1>
        <p class="effect">Effect?</p>
        <p class="lede">Elige a quien mejor vive cada categoría. Debes nominar en las 13 para poder enviar.</p>
        <div class="chips" aria-hidden="true">
          ${PRINCIPLES.map(c=>`<span style="background:${CHIP_BG[c.s]}">${esc(c.t)}</span>`).join("")}
          ${SPECIALS.map(c=>`<span style="background:${c.s==="black"?"var(--grandred)":CHIP_BG[c.s]};${c.s==="black"?"color:var(--paper)":""}">★ ${esc(c.name)}</span>`).join("")}
        </div>
      </div>
      <form class="panel" id="f" novalidate>
        <h3>Antes de empezar</h3>
        <div class="field">
          <label for="name">Tu nombre</label>
          <input id="name" autocomplete="name" placeholder="Nombre y apellido" value="${esc(state.name)}" maxlength="120">
        </div>
        <p class="err" id="err" hidden>Escribe tu nombre para continuar.</p>
        <div class="actions"><button class="btn" type="submit">Empezar →</button></div>
        <p class="deadline">Cierra el 15 de octubre</p>
      </form>
    </div>
  </section>`;
  document.getElementById("f").addEventListener("submit",e=>{
    e.preventDefault();
    const v = document.getElementById("name").value.trim();
    if(!v){ document.getElementById("err").hidden=false; document.getElementById("name").focus(); return; }
    state.name=v; state.step=1; save(); go();
  });
}

function renderBreak(){
  const i = state.step;
  app.innerHTML = `<section class="screen">
    ${topbar(10)}
    <div class="stage split enter">
      <div>
        <p class="sub" style="color:var(--yellow)">Y para cerrar</p>
        <h1 class="title">3 categorías<br>especiales</h1>
        <ul class="specials">
          ${SPECIALS.map(c=>`<li><span style="color:${c.s==="black"?"var(--grandred)":c.s==="blue"?"var(--skyblue)":"var(--yellow)"}">${esc(c.name)}</span><small>${c.d.replace(/<\/?b>/g,"")}</small></li>`).join("")}
        </ul>
      </div>
      <div class="panel" style="--effect:var(--yellow)">
        <h3>${state.added?"Hay categorías nuevas":"Casi terminas"}</h3>
        <p class="note" style="color:var(--paper)">${state.added
          ? "Agregamos 3 categorías especiales. Tus nominaciones anteriores siguen guardadas; completa estas y envía de nuevo. Recuerda que ahora todas las categorías son obligatorias."
          : "Estas tres reconocen a un equipo, a un proyecto y a la persona que mejor representa a draftLine."}</p>
        <div class="actions">
          <button class="btn ghost" type="button" id="back">← Atrás</button>
          <span class="spacer"></span>
          <button class="btn" type="button" id="next">Continuar →</button>
        </div>
      </div>
    </div>
  </section>`;
  document.getElementById("back").onclick=()=>{ state.step=i-1; save(); go(); };
  document.getElementById("next").onclick=()=>{ state.step=i+1; save(); go(); };
}

function renderCat(c){
  const i = state.step, a = state.answers[c.n] || {who:""};
  const last = STEPS[i+1] && STEPS[i+1].k==="summary";
  const idx = CATS.indexOf(c)+1;
  const head = c.special
    ? `<span class="eyebrow">Categoría especial · ${SPECIALS.indexOf(c)+1} de 3</span>
       <div class="theline">THE${c.bar?`<span class="bar" aria-hidden="true"></span>`:""}</div>
       <h1 class="title">${esc(c.t)}</h1>
       ${c.effect?`<p class="effect">Effect</p>`:""}`
    : `<p class="sub">${c.n}. ${esc(c.sub.toUpperCase())}</p>
       <h1 class="title">${esc(c.t)}</h1>
       <p class="effect">Effect</p>`;
  app.innerHTML = `<section class="screen s-${c.s}">
    ${topbar(idx)}
    <div class="stage split enter">
      <div>
        ${head}
        <p class="desc">${c.d}</p>
      </div>
      <form class="panel" id="f" novalidate>
        <h3>Tu nominación</h3>
        <div class="field">
          <label for="who">${esc(c.q||"¿A quién nominas?")}</label>
          <input id="who" placeholder="${esc(c.ph||"Nombre y apellido")}" value="${esc(a.who)}" maxlength="120" autocomplete="off" required>
        </div>
        <p class="err" id="err" hidden>Esta categoría es obligatoria. Escribe tu nominación para continuar.</p>
        <div class="actions">
          <button class="btn ghost" type="button" id="back">← Atrás</button>
          <span class="spacer"></span>
          <button class="btn" type="submit">${last?"Revisar →":"Siguiente →"}</button>
        </div>
      </form>
    </div>
  </section>`;
  const who=document.getElementById("who"), err=document.getElementById("err");
  const keep=()=>{ state.answers[c.n]={who:who.value.trim()}; save(); };
  who.addEventListener("input",keep);
  document.getElementById("back").onclick=()=>{ keep(); state.step=i-1; save(); go(); };
  document.getElementById("f").addEventListener("submit",e=>{
    e.preventDefault(); keep();
    if(!who.value.trim()){ delete state.answers[c.n]; save(); err.hidden=false; who.focus(); return; }
    state.step=i+1; save(); go();
  });
}

function filled(){ return CATS.filter(c=>state.answers[c.n] && state.answers[c.n].who); }

function renderSummary(){
  const count = filled().length;
  const row = c=>{ const a=state.answers[c.n]; return `<li>
      <span class="n ${c.special?"sm":""}">${c.special?"ESP":c.n}</span>
      <div style="min-width:0"><div class="cat">${esc(c.name)}</div>
      <div class="who ${a&&a.who?"":"missing"}">${a&&a.who?esc(a.who):"Falta nominar"}</div></div>
      <button class="edit" data-step="${STEPS.findIndex(s=>s.c===c)}" aria-label="Editar ${esc(c.name)}">Editar</button></li>`; };
  app.innerHTML = `<section class="screen">
    ${topbar(CATS.length)}
    <div class="stage split enter">
      <div>
        <p class="sub" style="color:var(--yellow)">Revisa antes de enviar</p>
        <h1 class="title">Tus<br>nominaciones</h1>
        <p class="effect" style="color:var(--yellow)">${count}/${CATS.length}</p>
        <p class="lede" style="max-width:40ch;font-weight:300">Nominas como <b>${esc(state.name)}</b>. Si envías de nuevo más adelante, tu última nominación en cada categoría reemplaza la anterior.</p>
      </div>
      <div class="panel" style="--effect:var(--yellow)">
        <ul class="sumlist">
          ${PRINCIPLES.map(row).join("")}
          <li class="sep">Categorías especiales</li>
          ${SPECIALS.map(row).join("")}
        </ul>
        ${!SCRIPT_URL?`<p class="preview-flag">Vista previa: el envío no se guarda hasta conectar la hoja de Google.</p>`:""}
        ${sendError?`<p class="err">${esc(sendError)}</p>`:""}
        <div class="actions">
          <button class="btn ghost" type="button" id="back">← Atrás</button>
          <span class="spacer"></span>
          <button class="btn" type="button" id="send" ${count===CATS.length&&!sending?"":"disabled"}>${sending?"Enviando…":"Enviar nominaciones"}</button>
        </div>
        ${count<CATS.length?`<p class="note">Te faltan ${CATS.length-count} ${CATS.length-count===1?"categoría":"categorías"} por nominar. Usa Editar para completarlas.</p>`:""}
      </div>
    </div>
  </section>`;
  app.querySelectorAll(".edit").forEach(b=>b.onclick=()=>{ state.step=+b.dataset.step; save(); go(); });
  document.getElementById("back").onclick=()=>{ state.step=STEPS.length-2; save(); go(); };
  document.getElementById("send").onclick=submit;
}

async function submit(){
  if (new Date() > DEADLINE){ render(); return; }
  if (filled().length < CATS.length) return;
  sending=true; sendError=""; renderSummary();
  const payload = {
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2)),
    nominador: state.name,
    nominaciones: filled().map(c=>({num:c.n, categoria:c.name, nominado:state.answers[c.n].who}))
  };
  try{
    if (SCRIPT_URL){
      const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error==="cerrado"?"Las nominaciones ya cerraron.":"No pudimos guardar tus nominaciones. Intenta de nuevo.");
    } else {
      await new Promise(r=>setTimeout(r,700));
    }
    sending=false; state.sent=true; state.added=false; if (SCRIPT_URL) state.resync=2; state.sentCount=payload.nominaciones.length; save(); go(); confetti();
  }catch(e){
    sending=false;
    sendError = e && e.message && !/fetch|JSON|network/i.test(e.message) ? e.message : "No pudimos enviar tus nominaciones. Revisa tu conexión e intenta de nuevo.";
    renderSummary();
  }
}

function renderDone(){
  app.innerHTML = `<section class="screen s-yellow">
    ${topbar(null)}
    <div class="stage enter">
      <div>
        <p class="sub">${state.sentCount||""} nominaciones enviadas${SCRIPT_URL?"":" (vista previa)"}</p>
        <h1 class="title">Gracias por hacer el</h1>
        <p class="effect">Effect</p>
        <p class="desc" style="max-width:36ch">Tus nominaciones quedaron registradas, ${esc(state.name.split(" ")[0])}. <b>Nos vemos en la premiación.</b></p>
        <div class="actions" style="margin-top:24px"><button class="btn" style="background:var(--ink);color:var(--yellow)" id="again" type="button">Cambiar mis nominaciones</button></div>
      </div>
    </div>
  </section>`;
  document.getElementById("again").onclick=()=>{ state.sent=false; state.step=STEPS.length-1; save(); go(); };
}

function renderClosed(){
  app.innerHTML = `<section class="screen s-blue">
    ${topbar(null)}
    <div class="stage enter"><div>
      <p class="sub">Las nominaciones cerraron el 15 de octubre</p>
      <h1 class="title">See you at the</h1>
      <p class="effect">Awards</p>
      <p class="desc">Gracias a todos los que nominaron. <b>Pronto conoceremos a los ganadores.</b></p>
    </div></div>
  </section>`;
}

/* Reenvío automático: quienes ya enviaron cuando el servidor aún no aceptaba
   las categorías especiales las reenvían en silencio al volver a abrir la página. */
async function resync(){
  if (!SCRIPT_URL || !state.sent || state.resync === 2 || new Date() > DEADLINE) return;
  const f = filled();
  if (!f.some(c=>c.special)) { state.resync = 2; save(); return; }
  try{
    const r = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      id:"resync-"+Date.now(), nominador:state.name,
      nominaciones:f.map(c=>({num:c.n, categoria:c.name, nominado:state.answers[c.n].who}))})});
    const j = await r.json();
    if (j.ok) { state.resync = 2; save(); }
  }catch(e){}
}

function go(){ render(); window.scrollTo({top:0,behavior:"instant"}); const f=app.querySelector("input,textarea"); if(f && matchMedia("(min-width:960px)").matches) f.focus({preventScroll:true}); }

function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d"); cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio;
  const cols=["#1E1E1E","#FF8A00","#F54880","#FF1E00","#0414E8","#FFFFFF"];
  const ps=Array.from({length:160},()=>({x:Math.random()*W,y:-Math.random()*H*.6,w:(6+Math.random()*10)*devicePixelRatio,h:(10+Math.random()*16)*devicePixelRatio,vy:(2+Math.random()*4)*devicePixelRatio,vx:(Math.random()-.5)*3*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(++t<260) requestAnimationFrame(f); else {ctx.clearRect(0,0,W,H);cv.hidden=true;}})();
}

render();
resync();
</script>
